services:
  # Single Python web service: serves the admin panel, API, and static client.
  # Client hosting is handled separately on Vercel (see vercel.json / app.py).
  - type: web
    name: e-invitations
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/test-db
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
